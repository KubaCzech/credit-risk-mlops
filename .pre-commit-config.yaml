repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
        # src/ml/artifacts/*.joblib is committed on purpose (see CI/CD section, README) and
        # Random Forest's alone is ~34MB, past any reasonable maxkb here - this hook exists
        # to catch *accidental* large commits (a stray data dump, a debug binary), not the
        # deliberate, already-documented model artifacts.
        exclude: ^src/ml/artifacts/

# mypy isn't a pre-commit hook here on purpose: it needs this project's real dependencies
# (torch, sklearn, xgboost, shap...) on its path to type-check meaningfully, and
# pre-commit's isolated hook environments make that expensive to keep in sync. It runs in
# CI instead, against the actual project venv - see .github/workflows/ci.yml.
