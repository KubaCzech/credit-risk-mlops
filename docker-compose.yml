services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: credit_risk
      POSTGRES_PASSWORD: credit_risk
      POSTGRES_DB: credit_risk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_risk"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      # "db", not "localhost" - the service name, resolved via Docker Compose's internal
      # DNS. This is exactly the seam flagged back in db/config.py: the localhost default
      # only ever worked because the API was running on the host, outside any container.
      DATABASE_URL: postgresql+psycopg://credit_risk:credit_risk@db:5432/credit_risk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
